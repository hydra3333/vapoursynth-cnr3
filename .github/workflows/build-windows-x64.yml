name: Build Windows x64 DLL

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build-windows-x64:
    name: Build Windows x64 DLL
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build cnr3.dll
        shell: cmd
        run: |
          if not exist build mkdir build

          cl ^
            /nologo ^
            /EHsc ^
            /std:c++17 ^
            /O2 ^
            /LD ^
            /I third_party\vapoursynth\include ^
            src\cnr3_api4_skeleton.cpp ^
            /Fe:build\cnr3.dll

      - name: Show build output
        shell: cmd
        run: |
          dir /s /b build

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapoursynth-cnr3-windows-x64
          path: build/cnr3.dll
