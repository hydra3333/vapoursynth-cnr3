name: Build Windows x64 DLL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-windows-x64:
    name: Build Windows x64 DLL
    runs-on: windows-2025-vs2026

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Show MSVC version
        shell: cmd
        run: |
          where cl
          cl

      - name: Check for legacy VapourSynth API usage
        shell: pwsh
        run: |
          $patterns = @(
            '#include\s+[<"]VapourSynth\.h[>"]',
            '#include\s+[<"]VSHelper\.h[>"]',
            'VSNodeRef',
            'VSFrameRef',
            'VSFuncRef',
            'cloneFrameRef',
            'cloneFrame\(',
            'freeFrameRef',
            'createFilter\('
          )
          $files = Get-ChildItem -Path src -Recurse -Include *.c,*.cc,*.cpp,*.h,*.hpp
          foreach ($pattern in $patterns) {
              $matches = $files | Select-String -Pattern $pattern
              if ($matches) {
                  Write-Error "Legacy VapourSynth API pattern found: $pattern"
                  $matches | ForEach-Object {
                      Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)"
                  }
                  exit 1
              }
          }
          Write-Host "No obvious legacy VapourSynth API usage found."

      - name: Build cnr3.dll
        shell: cmd
        run: |
          if not exist build mkdir build

          cl ^
            /nologo ^
            /EHsc ^
            /std:c++20 ^
            /permissive- ^
            /O2 ^
            /GL ^
            /LD ^
            /MD ^
            /DNOMINMAX ^
            /I third_party\vapoursynth\include ^
            /Fo:build\ ^
            src\vapoursynth-Cnr3.cpp ^
            src\cnr3_cache.cpp ^
            /Fe:build\cnr3.dll ^
            /link ^
            /LTCG

      - name: Show build output and DLL exports
        shell: cmd
        run: |
          echo === Build directory ===
          dir build
          echo.
          echo === Recursive build output ===
          dir /s build
          echo.
          echo === DLL machine / characteristics ===
          dumpbin /headers build\cnr3.dll | findstr /i "machine DLL"
          echo.
          echo === DLL exports ===
          dumpbin /exports build\cnr3.dll
          echo.
          echo === SHA256 ===
          certutil -hashfile build\cnr3.dll SHA256

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: vapoursynth-cnr3-windows-x64
          path: build/cnr3.dll
