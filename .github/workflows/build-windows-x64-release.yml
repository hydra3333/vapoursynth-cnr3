name: Build and Release Windows x64 DLL with a pypi Wheel

# CRITICAL NOTES:
#   1. Release Tag MUST STRICTLY be of the form:   v1.01
#      of this yml will fail.
#
#   2. Installable directly from github latest release via:
#      "%py_exe%" -m pip install --disable-pip-version-check --no-cache-dir --upgrade --upgrade-strategy eager ^
#           --no-warn-script-location --check-build-dependencies --verbose  --no-build-isolation ^
#           "vapoursynth-cnr3 @ https://github.com/hydra3333/vapoursynth-cnr3/releases/latest/download/vapoursynth_cnr3-latest-py3-none-win_amd64.whl"
#
# Triggers: 
#   1. Manual run from the Actions tab
#   or
#   2. Creation of a GitHub Release.
#      On a Release trigger, the zip AND the pip-installable wheels are attached to the Release itself.
on:
  workflow_dispatch:
  release:
    types: [created]

permissions:
  contents: write   # needed to attach assets to the Release

jobs:
  build-windows-x64:
    name: Build cnr3.dll (Release x64, VS2026)
    # windows-latest = Windows Server 2025 + Visual Studio 2026 (v145) since the
    # June 2026 image migration. Free for public repos.
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure MSVC x64 environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Derive package version for a pypi wheel
        shell: pwsh
        run: |
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            # tag like v1.01 -> 1.01  (PEP 440 wants a numeric-ish version)
            $ver = "${{ github.event.release.tag_name }}" -replace '^v',''
          } else {
            # manual dispatch: no release tag -> local dev version
            $ver = "0.0.0+localbuild"
          }
          Write-Host "Package version: $ver"
          "PKG_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Show toolchain versions
        shell: cmd
        run: |
          where cl
          cl 2>&1 | findstr /i "version"

      - name: Verify vendored VapourSynth headers present
        shell: pwsh
        run: |
          $h = "third_party/vapoursynth/include/VapourSynth4.h"
          if (-not (Test-Path $h)) { Write-Error "Vendored header missing: $h"; exit 1 }
          # Show the API version macros for the log (provenance)
          Select-String -Path $h -Pattern "VAPOURSYNTH_API_MAJOR|VAPOURSYNTH_API_MINOR" | ForEach-Object { $_.Line }
          Write-Host "NOTE: building against vendored headers (API4, default 4.0 profile)."

      - name: Check for legacy VapourSynth API usage
        shell: pwsh
        run: |
          $patterns = @(
            '#include\s+[<"]VapourSynth\.h[>"]',
            '#include\s+[<"]VSHelper\.h[>"]',
            'VSNodeRef','VSFrameRef','VSFuncRef',
            'cloneFrameRef','cloneFrame\(','freeFrameRef','createFilter\('
          )
          $files = Get-ChildItem -Path src -Recurse -Include *.c,*.cc,*.cpp,*.h,*.hpp
          foreach ($p in $patterns) {
            $m = $files | Select-String -Pattern $p
            if ($m) {
              Write-Error "Legacy VapourSynth API pattern found: $p"
              $m | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber): $($_.Line)" }
              exit 1
            }
          }
          Write-Host "No legacy VapourSynth API usage found."

      - name: Show embedded provenance marker (CNR3_EDIT_VERSION)
        shell: pwsh
        run: |
          $m = Select-String -Path "src/cnr3_build_config.h" -Pattern 'CNR3_EDIT_VERSION_LITERAL\s+"'
          if (-not $m) { Write-Error "CNR3_EDIT_VERSION_LITERAL not found"; exit 1 }
          $m.Line.Trim()
          # capture for later steps
          $marker = ($m.Line -replace '.*"(.*)".*','$1')
          "CNR3_MARKER=$marker" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build cnr3.dll (mirrors vcxproj Release|x64 exactly - see flag map)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          # Source list: every src/*.cpp EXCEPT the selftest exe's main().
          # (Mirrors the vcxproj ClCompile items; wildcard keeps it in sync forever.)
          $sources = Get-ChildItem src -Filter *.cpp |
                     Where-Object Name -ne 'cnr3_cache_core_selftest_main.cpp' |
                     ForEach-Object { $_.FullName }
          Write-Host "Compiling:"; $sources | ForEach-Object { Write-Host "  $_" }

          # ---- FLAG MAP (cl flag  <-  vcxproj Release|x64 setting) ----
          #  /O2 /Ot        <- Optimization=MaxSpeed, FavorSizeOrSpeed=Speed
          #  /Ob2           <- InlineFunctionExpansion=AnySuitable
          #  /Oi            <- IntrinsicFunctions=true
          #  /GL            <- WholeProgramOptimization=true
          #  /arch:AVX2     <- EnableEnhancedInstructionSet=AdvancedVectorExtensions2
          #  /GS /sdl       <- SDLCheck=true (security kept in Release by decision)
          #  /fp:precise    <- explicit by decision (do NOT change to /fp:fast)
          #  /Gy /Zc:inline <- function-level linking + drop unreferenced inlines
          #  /std:c++20 /permissive- <- LanguageStandard, ConformanceMode
          #  /EHsc /MD /MP  <- C++ exceptions, dynamic CRT, parallel compile
          #  /W3            <- WarningLevel=Level3
          #  /Zi /Fd        <- DebugInformationFormat=ProgramDatabase (PDB kept)
          #  defines        <- NDEBUG;CNR3_EXPORTS;_WINDOWS;_USRDLL;NOMINMAX + Unicode (NOMINMAX also set in vcxproj)
          #  link /LTCG     <- LinkTimeCodeGeneration
          #  link /OPT:REF  <- discard unreferenced functions (pairs with /Gy)
          #  link /OPT:NOICF<- EnableCOMDATFolding=false (deliberate: speed over size)
          #  link /DEBUG    <- GenerateDebugInformation=true
          cl /nologo /W3 /EHsc /MD /MP `
             /std:c++20 /permissive- `
             /O2 /Ot /Ob2 /Oi /GL /arch:AVX2 `
             /GS /sdl /fp:precise /Gy /Zc:inline `
             /Zi /Fdbuild\cnr3.pdb `
             /DNDEBUG /DCNR3_EXPORTS /D_WINDOWS /D_USRDLL /DUNICODE /D_UNICODE /DNOMINMAX `
             /I third_party\vapoursynth\include `
             /Fobuild\ `
             $sources `
             /LD /Febuild\cnr3.dll `
             /link /LTCG /OPT:REF /OPT:NOICF /DEBUG /PDB:build\cnr3.pdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify DLL (machine, exports, hash)
        shell: cmd
        run: |
          echo === DLL machine / characteristics ===
          dumpbin /headers build\cnr3.dll | findstr /i "machine DLL"
          echo.
          echo === Exports (must include VapourSynthPluginInit2) ===
          dumpbin /exports build\cnr3.dll
          dumpbin /exports build\cnr3.dll | findstr /i "VapourSynthPluginInit2" >nul || (echo MISSING PLUGIN ENTRY POINT & exit /b 1)
          echo.
          echo === SHA256 ===
          certutil -hashfile build\cnr3.dll SHA256

      - name: Assemble release zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/cnr3.dll dist/
          Copy-Item README.md dist/README_CNR3.md
          $hash = (Get-FileHash build/cnr3.dll -Algorithm SHA256).Hash
          "$hash  cnr3.dll" | Out-File dist/SHA256SUMS.txt -Encoding ascii
          # provenance file: marker + commit + toolchain
          @(
            "marker:  $env:CNR3_MARKER"
            "commit:  $env:GITHUB_SHA"
            "ref:     $env:GITHUB_REF"
            "built:   $(Get-Date -AsUTC -Format o) (UTC)"
            "runner:  windows-latest (WS2025 + VS2026)"
            "sha256:  $hash"
          ) | Out-File dist/BUILD_INFO.txt -Encoding ascii
          Get-Content dist/BUILD_INFO.txt
          $zip = "vapoursynth-cnr3-windows-x64.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip -Force
          "ZIP_NAME=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build pip-installable plugin wheel
        shell: pwsh
        run: |
          # A VapourSynth plugin wheel needs no build backend: it is a structured
          # zip that places the already-built DLL at
          #   site-packages/vapoursynth/plugins/cnr3/cnr3.dll
          # which is exactly where VapourSynth's recursive autoload scans.
          # Layout mirrors the official vapoursynth-vszip wheel.
          $ver = $env:PKG_VERSION
          $root = "wheelroot"
          if (Test-Path $root) { Remove-Item -Recurse -Force $root }
          $pkgdir = "$root/vapoursynth/plugins/cnr3"
          $info   = "$root/vapoursynth_cnr3-$ver.dist-info"
          New-Item -ItemType Directory -Force $pkgdir | Out-Null
          New-Item -ItemType Directory -Force $info   | Out-Null
          Copy-Item build/cnr3.dll "$pkgdir/cnr3.dll"

          # ---- METADATA ----
          $metadata = @(
            "Metadata-Version: 2.1"
            "Name: vapoursynth-cnr3"
            "Version: $ver"
            "Summary: CNR3 - recursive temporal chroma stabiliser (VapourSynth API4 plugin)"
            "Home-page: https://github.com/hydra3333/vapoursynth-cnr3"
            "License: MIT"
            "Requires-Python: >=3.12"
            "Classifier: Environment :: Plugins"
            "Classifier: Operating System :: Microsoft :: Windows"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $info "METADATA"), $metadata + "`n")

          # ---- WHEEL (platform wheel: compiled DLL, Windows x64) ----
          $wheelmeta = @(
            "Wheel-Version: 1.0"
            "Generator: cnr3-ci"
            "Root-Is-Purelib: false"
            "Tag: py3-none-win_amd64"
          ) -join "`n"
          [IO.File]::WriteAllText((Join-Path $info "WHEEL"), $wheelmeta + "`n")

          # ---- RECORD (sha256 + size per file, per the wheel spec) ----
          $sha = [Security.Cryptography.SHA256]::Create()
          $recordLines = @()
          foreach ($rel in @("vapoursynth/plugins/cnr3/cnr3.dll",
                             "vapoursynth_cnr3-$ver.dist-info/METADATA",
                             "vapoursynth_cnr3-$ver.dist-info/WHEEL")) {
            $bytes = [IO.File]::ReadAllBytes((Join-Path $root $rel))
            $digest = $sha.ComputeHash($bytes)
            $b64 = [Convert]::ToBase64String($digest).TrimEnd('=').Replace('+','-').Replace('/','_')
            $recordLines += "$rel,sha256=$b64,$($bytes.Length)"
          }
          $recordLines += "vapoursynth_cnr3-$ver.dist-info/RECORD,,"
          [IO.File]::WriteAllText((Join-Path $info "RECORD"), ($recordLines -join "`n") + "`n")

          # ---- zip into a .whl (wheels are just zips; name encodes the tag) ----
          $whl = "vapoursynth_cnr3-$ver-py3-none-win_amd64.whl"
          if (Test-Path $whl) { Remove-Item $whl }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path $root), (Join-Path (Get-Location) $whl))
          Write-Host "Built wheel: $whl"
          "WHEEL_NAME=$whl" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          # Stable-named copy so a fixed 'releases/latest/download/...' URL always
          # resolves to the newest wheel. pip reads the real version from the
          # wheel METADATA (not the filename), so --upgrade still detects changes.
          $stable = "vapoursynth_cnr3-latest-py3-none-win_amd64.whl"
          Copy-Item $whl $stable -Force
          Write-Host "Stable-named copy: $stable"
          "WHEEL_STABLE=$stable" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify wheel structure
        shell: pwsh
        run: |
          $whl = $env:WHEEL_NAME
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [IO.Compression.ZipFile]::OpenRead((Resolve-Path $whl))
          Write-Host "=== wheel contents ==="
          $zip.Entries | ForEach-Object { Write-Host ("  {0,8}  {1}" -f $_.Length, $_.FullName) }
          $hasDll = $zip.Entries | Where-Object FullName -eq 'vapoursynth/plugins/cnr3/cnr3.dll'
          $zip.Dispose()
          if (-not $hasDll) { Write-Error "wheel missing plugin DLL at expected path"; exit 1 }
          Write-Host "Wheel structure OK."

      - name: Upload workflow artifacts (always)
        uses: actions/upload-artifact@v4
        with:
          name: vapoursynth-cnr3-windows-x64
          path: |
            vapoursynth-cnr3-windows-x64.zip
            vapoursynth_cnr3-*-py3-none-win_amd64.whl
            vapoursynth_cnr3-latest-py3-none-win_amd64.whl

      # Do not upload symbols (for now)
      #- name: Upload debug symbols (separate artifact)
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: cnr3-pdb
      #    path: build/cnr3.pdb

      - name: Attach assets to the Release (release trigger only)
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" `
             "$env:ZIP_NAME" "$env:WHEEL_NAME" "$env:WHEEL_STABLE" --clobber
